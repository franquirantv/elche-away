name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elche_away_development
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elche_away_development"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Ephemeral local CI credentials; never connects to Neon or production.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/elche_away_development
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/elche_away_development
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/elche_away_testing
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare isolated testing database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d elche_away_development -c 'CREATE DATABASE elche_away_testing'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

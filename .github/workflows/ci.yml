name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: elche_away_development
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d elche_away_development"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Ephemeral local CI credentials; never connects to Neon or production.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/elche_away_development
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/elche_away_development
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/elche_away_testing
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # Pin reviewed releases to immutable commits; update SHA and version together.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare isolated testing database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d elche_away_development -c 'CREATE DATABASE elche_away_testing'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
